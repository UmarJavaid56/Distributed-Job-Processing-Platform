services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: TaskFlow
      DATABASE_URL: postgresql+psycopg://taskflow:taskflow@db:5432/taskflow
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build: ./backend
    command: ["python", "-m", "app.workers.worker"]
    environment:
      APP_NAME: TaskFlow
      DATABASE_URL: postgresql+psycopg://taskflow:taskflow@db:5432/taskflow
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
  redis_data:
